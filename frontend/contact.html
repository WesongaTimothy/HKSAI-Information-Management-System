<div class="glass-wrapper">
  <section class="hero-section">
    <h1>Get In Touch</h1>
    <p>Partner with us or ask a question about our community impact.</p>
  </section>

  <main class="content-grid" style="max-width: 800px;">
    <div class="donation-card">
      <div class="card-body">
        <form style="display: flex; flex-direction: column; gap: 15px;">
          <input type="text" placeholder="Full Name" style="padding: 12px; border-radius: 5px; border: 1px solid #ccc;">
          <input type="email" placeholder="Email Address" style="padding: 12px; border-radius: 5px; border: 1px solid #ccc;">
          <textarea placeholder="Your Message" rows="5" style="padding: 12px; border-radius: 5px; border: 1px solid #ccc;"></textarea>
          <button class="donate-btn">Send Message</button>
        </form>
      </div>
    </div>
  </main>
</div>
