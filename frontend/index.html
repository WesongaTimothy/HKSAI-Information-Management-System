<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKSAI | 2030 Strategic Hub</title>
    <style>
        :root {
            --maroon: #800000;
            --gold: #D4AF37;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.97);
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('frontend/H1.jpeg');
            background-size: cover;
            background-attachment: fixed;
            color: #333;
        }

        /* --- HEADER --- */
        header.portal-header {
            background: var(--maroon);
            padding: 20px 5%;
            border-bottom: 5px solid var(--gold);
            text-align: center;
        }

        .header-title {
            color: white;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        nav.main-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav.main-nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            padding: 8px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }

        nav.main-nav a:hover { background: var(--gold); color: var(--maroon); }

        /* --- FULL WIDTH SLIDER --- */
        .full-slider {
            width: 100%;
            height: 500px; /* Adjust height as needed */
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .mySlides {
            display: none;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .fade {
            animation: fadeEffect 2s ease-in-out;
        }

        @keyframes fadeEffect {
            from {opacity: 0.4} 
            to {opacity: 1}
        }

        .overlay-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            width: 90%;
            z-index: 10;
        }

        /* --- CONTENT AREA --- */
        .portal-container {
            max-width: 1200px;
            margin: -50px auto 40px; /* Overlaps slider slightly for professional look */
            padding: 0 20px;
            position: relative;
            z-index: 20;
        }

        .content-card {
            background: var(--glass);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }

        .vision-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 40px;
        }
