<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HKSAI Portal</title>
    <style>
        :root {
            --maroon: #800000;
            --gold: #D4AF37;
            --white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('H1.jpeg');
            background-size: cover;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            border-top: 5px solid var(--maroon);
        }

        .login-card h2 {
            color: var(--maroon);
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .login-card p {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        .btn-login {
            width: 100%;
            background: var(--maroon);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: var(--gold);
            color: var(--maroon);
        }

        .footer-links {
            margin-top: 20px;
            font-size: 0.8rem;
        }

        .footer-links a { color: var(--maroon); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="login-card">
    <div style="color: var(--gold); font-weight: 800; font-size: 1.2rem; margin-bottom: 10px;">HOPE KSAI</div>
    <h2>Stakeholder Login</h2>
    <p>Enter your credentials to access the 2030 Impact Dashboard.</p>
    
    <form action="dashboard.html">
        <input type="email" placeholder="Email Address" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" class="btn-login">SECURE LOGIN</button>
    </form>

    <div class="footer-links">
        <a href="contact.html">Forgot Password?</a> • <a href="index.html">Return Home</a>
    </div>
</div>

</body>
</html>
